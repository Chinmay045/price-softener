<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="icons/icon32.png" alt="" width="18" height="18"> Price Softener</h1>
    <label class="switch" title="Alt+Shift+H">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <section class="field">
    <div class="row">
      <span>Show prices lower by</span>
      <strong id="percentLabel">25%</strong>
    </div>
    <input type="range" id="percent" min="0" max="90" step="1">
  </section>

  <section class="preview">
    <span class="real" id="previewReal">₹1,29,999</span>
    <span class="arrow">→</span>
    <span class="soft" id="previewSoft">₹97,999</span>
  </section>

  <section class="field">
    <label class="check">
      <input type="checkbox" id="natural">
      Round to natural endings (e.g. 84,999)
    </label>
    <label class="check">
      <input type="checkbox" id="realInCart">
      Show real prices in the cart too
    </label>
    <div class="row">
      <label for="minAmount">Only change prices above ₹</label>
      <input type="number" id="minAmount" min="0" step="100">
    </div>
  </section>

  <p class="note">
    Checkout and payment pages always show the <b>real</b> price.
    Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>H</kbd> switches it on/off.
  </p>

  <script src="pricing.js"></script>
  <script src="popup.js"></script>
</body>
</html>
