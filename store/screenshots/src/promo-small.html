<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 440px; height: 280px; }
  body { background: linear-gradient(135deg, #2f6f4f 0%, #1f4d37 100%); color: #fff; }
  .tile { width: 440px; height: 280px; padding: 30px 32px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 44px; height: 44px; border-radius: 10px; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
  .top b { font-size: 26px; letter-spacing: -.2px; }
  .tagline { font-size: 22px; line-height: 1.3; font-weight: 600; }
  .tagline span { color: #bfe3cd; }
  .price { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 16px; font-size: 22px; }
  .price s { color: var(--muted); font-size: 18px; }
  .price b { color: var(--green); }
</style></head>
<body><div class="tile">
  <div class="top"><img src="../../../icons/icon128.png" alt=""><b>Price Softener</b></div>
  <div class="tagline">Keep gift prices private.<br><span>Real price at checkout, always.</span></div>
  <div class="price"><s>₹1,29,999</s>→<b>₹73,999</b></div>
</div></body></html>
