<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared.css">
<style>
  .page { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 64px; margin-top: 0; }
  .quote {
    margin-top: 44px; background: #fff; border-radius: 22px; padding: 26px 36px;
    font-size: 30px; line-height: 1.4; box-shadow: 0 16px 40px rgba(31,77,55,.14); position: relative;
  }
  .quote::after { content: ""; position: absolute; left: 60px; bottom: -16px; border: 16px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .who { margin-top: 34px; color: var(--muted); font-size: 22px; }
</style></head>
<body><div class="page">
  <h1>Buying a phone for <em>Amma &amp; Appa?</em></h1>
  <div class="quote">"₹1,29,999?! Too expensive.<br>Don't waste money on us."</div>
  <div class="who">Sound familiar?</div>
</div></body></html>
